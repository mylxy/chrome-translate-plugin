<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DeepSeek 划词翻译</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="options-shell">
      <section class="panel" aria-labelledby="options-title">
        <header class="panel-header">
          <h1 id="options-title">DeepSeek 划词翻译设置</h1>
          <p>配置翻译服务和默认目标语言。</p>
        </header>

        <form class="settings-form">
          <label for="apiKey">API Key</label>
          <input id="apiKey" name="apiKey" type="password" autocomplete="off" spellcheck="false" />

          <label for="targetLanguage">目标语言</label>
          <select id="targetLanguage" name="targetLanguage">
            <option value="zh-CN">简体中文</option>
            <option value="en-US">English</option>
            <option value="ja-JP">日本語</option>
            <option value="ko-KR">한국어</option>
          </select>

          <div class="actions">
            <button id="save" type="submit">保存</button>
            <button id="clearCache" class="secondary" type="button">清空缓存</button>
          </div>

          <p id="status" class="status" role="status" aria-live="polite"></p>
        </form>
      </section>
    </main>
    <script type="module" src="./index.ts"></script>
  </body>
</html>
